name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_agent_eval:
        description: "Also run the eval with the real Claude agent (uses the ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  agent-eval:
    name: Agent eval (scripted, offline)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # Deterministic: validates that the harness rejects every wrong candidate and accepts every real fix.
      - run: bench eval examples/tasks --proposer scripted --min-solve-rate 1.0 --report-out eval-scripted.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-scripted
          path: eval-scripted.json

  agent-eval-live:
    name: Agent eval (live Claude, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.live_agent_eval
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[agent]"
      # Never fails the build: a live model's score is a measurement, not a gate.
      - run: bench eval examples/tasks --proposer anthropic --report-out eval-live.json || true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-live
          path: eval-live.json
