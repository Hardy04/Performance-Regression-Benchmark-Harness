[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-harness"
version = "0.1.0"
description = "CLI tool to detect performance regressions with statistical significance testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "psutil>=5.9",
    "rich>=13.0",
    "requests>=2.31",
    "scipy>=1.11",
]

[project.scripts]
bench = "benchmark_harness.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
